services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server
    env_file:
      - db_creds.env
    ports:
      - "8000:8000"
    restart: always

  db:
    image: postgres:18
    container_name: database
    env_file:
      - db_creds.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always

volumes:
  postgres_data:
