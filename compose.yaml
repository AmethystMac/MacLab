services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server
    ports:
      - "8000:8000"
    restart: always

  db:
    image: postgres:18
    container_name: database
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always

volumes:
  postgres_data:
